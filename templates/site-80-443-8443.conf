server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    include /config/nginx/ssl.conf;
    set $backend_name nginx_test4;

    location / {
        default_type text/html;
        return 200 "<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>$backend_name backend</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}.card{background:#fff;padding:32px;border-radius:12px;box-shadow:0 4px 16px #0002;max-width:640px;width:90vw;text-align:center}h1{margin-top:0;color:#0f172a}.value{display:inline-block;margin-top:8px;padding:8px 12px;background:#e5e7eb;border-radius:6px;font-family:Consolas,monospace;font-size:1.1rem}</style></head><body><div class=card><h1>Hello from Nginx</h1><div class=value>$backend_name backend on port $server_port</div><div class=value>Path: <span></span><script>document.currentScript.previousElementSibling.textContent=location.pathname;</script></div></div></body></html>";
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    listen 8443 quic reuseport default_server;
    listen [::]:8443 quic reuseport default_server;

    server_name _;
    include /config/nginx/ssl.conf;
    set $backend_name nginx_test4;

    location / {
        default_type text/html;
        return 200 "<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content=width=device-width,initial-scale=1><title>$backend_name backend</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:#f4f6f8;color:#222}.card{background:#fff;padding:32px;border-radius:12px;box-shadow:0 4px 16px #0002;max-width:640px;width:90vw;text-align:center}h1{margin-top:0;color:#0f172a}.value{display:inline-block;margin-top:8px;padding:8px 12px;background:#e5e7eb;border-radius:6px;font-family:Consolas,monospace;font-size:1.1rem}</style></head><body><div class=card><h1>Hello from Nginx</h1><div class=value>$backend_name backend on port $server_port</div><div class=value>Path: <span></span><script>document.currentScript.previousElementSibling.textContent=location.pathname;</script></div></div></body></html>";
    }

    location ~ ^(.+\.php)(.*)$ {
        fastcgi_split_path_info ^(.+\.php)(.*)$;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
